# Hostless deployment settings for the remote reasoning worker.
#
# Build the committed Dockerfile, run one replica because the worker keeps
# OpenCode state on a volume, and use a TCP probe because every worker route
# (including /health) requires a Bearer API key and Hostless HTTP probes cannot
# send custom headers.
build:
  system: docker
dockerfile_path: ./Dockerfile
start_command: "node server.js"

scaling:
  trigger: http_requests
  min_replicas: 1
  max_replicas: 1
  min_cpu: 0.1
  max_cpu: 0.5
  min_memory: 512
  max_memory: 1024
  max_http_requests_per_replica: 8

health_check:
  type: tcp
  interval_in_seconds: 15
